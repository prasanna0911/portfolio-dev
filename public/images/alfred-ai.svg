<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_alfred" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0b121e"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="glow_cyan" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1018" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid_pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg_alfred)"/>
  <rect width="1200" height="800" fill="url(#grid_pattern)"/>
  <rect width="1200" height="800" fill="url(#glow_cyan)"/>

  <!-- Top badge -->
  <g transform="translate(100, 70)">
    <rect width="210" height="34" rx="17" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.4"/>
    <circle cx="20" cy="17" r="4" fill="#06b6d4"/>
    <text x="34" y="22" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1">SIMBLI AI PLATFORM</text>
  </g>

  <!-- Mockup Window Shell -->
  <g transform="translate(100, 130)">
    <!-- Main Window Background -->
    <rect width="1000" height="580" rx="16" fill="url(#card_grad)" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>
    
    <!-- Title Bar -->
    <rect width="1000" height="48" rx="16" fill="#0b1018" fill-opacity="0.9"/>
    <rect y="47" width="1000" height="1" fill="#1e293b"/>
    <circle cx="28" cy="24" r="5.5" fill="#f87171" fill-opacity="0.8"/>
    <circle cx="48" cy="24" r="5.5" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="68" cy="24" r="5.5" fill="#34d399" fill-opacity="0.8"/>
    <text x="500" y="29" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">alfred.simbli.ai/agent/dashboard</text>

    <!-- Left Sidebar -->
    <rect x="0" y="48" width="220" height="532" fill="#080c14" fill-opacity="0.7"/>
    <line x1="220" y1="48" x2="220" y2="580" stroke="#1e293b"/>
    
    <text x="24" y="90" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">AGENT WORKSPACE</text>
    
    <!-- Active Nav item -->
    <rect x="16" y="110" width="188" height="38" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3"/>
    <circle cx="34" cy="129" r="4" fill="#60a5fa"/>
    <text x="48" y="133" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="500">Alfred AI Agent</text>

    <text x="48" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Campaigns</text>
    <text x="48" y="222" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Connected Channels</text>
    <text x="48" y="264" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Admin Panel</text>
    <text x="48" y="306" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Microservices APIs</text>
    <text x="48" y="348" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Zernio Integration</text>

    <!-- Main Content Area -->
    <!-- Metric 1 -->
    <g transform="translate(250, 75)">
      <rect width="225" height="90" rx="10" fill="#0b1018" stroke="#1e293b"/>
      <text x="18" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Social Channels Connected</text>
      <text x="18" y="68" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">12 Active</text>
      <circle cx="195" cy="45" r="14" fill="#06b6d4" fill-opacity="0.15"/>
      <text x="195" y="49" fill="#06b6d4" font-family="sans-serif" font-size="12" text-anchor="middle">✓</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(495, 75)">
      <rect width="225" height="90" rx="10" fill="#0b1018" stroke="#1e293b"/>
      <text x="18" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Scheduled AI Content</text>
      <text x="18" y="68" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">1,842 Posts</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(740, 75)">
      <rect width="225" height="90" rx="10" fill="#0b1018" stroke="#1e293b"/>
      <text x="18" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Microservice Health</text>
      <text x="18" y="68" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">99.98% OK</text>
    </g>

    <!-- AI Generation Visual Panel -->
    <g transform="translate(250, 185)">
      <rect width="715" height="230" rx="12" fill="#080d16" stroke="#1e293b"/>
      <text x="24" y="36" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600">AI Autonomous Publishing Pipeline</text>
      <text x="24" y="58" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">Node.js · Python Microservices · Zernio API · MySQL</text>
      
      <!-- Pipeline Nodes -->
      <g transform="translate(24, 80)">
        <!-- Node 1 -->
        <rect width="180" height="110" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="16" y="30" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="11">01: CONTENT CREATION</text>
        <text x="16" y="56" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Prompt &amp; Generate</text>
        <rect x="16" y="74" width="80" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="24" y="88" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="10">Python LLM</text>

        <!-- Arrow 1 -->
        <line x1="190" y1="55" x2="230" y2="55" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>

        <!-- Node 2 -->
        <g transform="translate(240, 0)">
          <rect width="180" height="110" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
          <text x="16" y="30" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="11">02: SCHEDULING API</text>
          <text x="16" y="56" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Zernio Social Sync</text>
          <rect x="16" y="74" width="90" height="20" rx="4" fill="#06b6d4" fill-opacity="0.2"/>
          <text x="24" y="88" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="10">Node.js REST</text>
        </g>

        <!-- Arrow 2 -->
        <line x1="430" y1="55" x2="470" y2="55" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>

        <!-- Node 3 -->
        <g transform="translate(480, 0)">
          <rect width="180" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
          <text x="16" y="30" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11">03: ADMIN &amp; METRICS</text>
          <text x="16" y="56" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="600">User Subscriptions</text>
          <rect x="16" y="74" width="75" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
          <text x="24" y="88" fill="#34d399" font-family="'Inter', sans-serif" font-size="10">MySQL Auth</text>
        </g>
      </g>
    </g>

    <!-- Bottom Terminal Snippet -->
    <g transform="translate(250, 430)">
      <rect width="715" height="120" rx="10" fill="#04060a" stroke="#1e293b"/>
      <text x="20" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">$ curl -X POST https://api.simbli.ai/v1/alfred/schedule \</text>
      <text x="40" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">-H "Authorization: Bearer simbli_jwt_token" \</text>
      <text x="40" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">-d '{"platforms": ["linkedin", "x", "instagram"], "status": "PUBLISHED"}'</text>
      <text x="20" y="102" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12">✓ 200 OK — Broadcast scheduled via Zernio microservice [latency: 42ms]</text>
    </g>
  </g>
</svg>

<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_dream" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090a12"/>
      <stop offset="60%" stop-color="#111322"/>
      <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>
    <radialGradient id="glow_purple" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_pattern3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#818cf8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg_dream)"/>
  <rect width="1200" height="800" fill="url(#grid_pattern3)"/>
  <rect width="1200" height="800" fill="url(#glow_purple)"/>

  <!-- Top badge -->
  <g transform="translate(100, 70)">
    <rect width="260" height="34" rx="17" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4"/>
    <circle cx="20" cy="17" r="4" fill="#a5b4fc"/>
    <text x="34" y="22" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1">DREAMSWED.COM PLATFORM</text>
  </g>

  <!-- Mockup Window Shell -->
  <g transform="translate(100, 130)">
    <rect width="1000" height="580" rx="16" fill="#0d111c" stroke="#334155" stroke-width="1"/>
    
    <!-- Title Bar -->
    <rect width="1000" height="48" rx="16" fill="#090d16"/>
    <rect y="47" width="1000" height="1" fill="#1e293b"/>
    <circle cx="28" cy="24" r="5.5" fill="#f87171" fill-opacity="0.8"/>
    <circle cx="48" cy="24" r="5.5" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="68" cy="24" r="5.5" fill="#34d399" fill-opacity="0.8"/>
    <text x="500" y="29" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">admin.dreamswed.com/city-manager/approvals</text>

    <!-- Top Workflow Banner -->
    <g transform="translate(40, 70)">
      <rect width="920" height="70" rx="10" fill="#131b2e" stroke="#1e293b"/>
      <text x="24" y="28" fill="#818cf8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1">MULTI-ROLE WORKFLOW</text>
      <text x="24" y="52" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="600">Vendor Submission ➔ City Manager Review &amp; Approval ➔ Live Marketplace</text>
      
      <rect x="760" y="18" width="135" height="34" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="827" y="40" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ Active System</text>
    </g>

    <!-- Content: Vendor Cards and Approval Queue -->
    <g transform="translate(40, 160)">
      <!-- Left Column: Pending Vendor Listings -->
      <rect width="450" height="370" rx="12" fill="#090e17" stroke="#1e293b"/>
      <text x="20" y="32" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600">City Manager Approval Queue</text>
      
      <!-- Vendor item 1 -->
      <g transform="translate(20, 50)">
        <rect width="410" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="28" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Royal Grand Palace &amp; Banquets</text>
        <text x="16" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Category: Venues · City: Chennai · Tier: Premium</text>
        <rect x="290" y="20" width="100" height="26" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="340" y="37" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Approve</text>
      </g>

      <!-- Vendor item 2 -->
      <g transform="translate(20, 150)">
        <rect width="410" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="28" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Lumière Cinematic Studios</text>
        <text x="16" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Category: Photography · City: Madurai · Tier: Standard</text>
        <rect x="290" y="20" width="100" height="26" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="340" y="37" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Approve</text>
      </g>

      <!-- Vendor item 3 -->
      <g transform="translate(20, 250)">
        <rect width="410" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="28" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Aura Bridal Artistry</text>
        <text x="16" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Category: Makeup &amp; Styling · City: Coimbatore</text>
        <rect x="290" y="20" width="100" height="26" rx="4" fill="#34d399" fill-opacity="0.2"/>
        <text x="340" y="37" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Approved</text>
      </g>
    </g>

    <!-- Right Column: System Modules & DB Model -->
    <g transform="translate(510, 160)">
      <rect width="450" height="370" rx="12" fill="#090e17" stroke="#1e293b"/>
      <text x="20" y="32" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600">Platform Modules &amp; Tech Stack</text>

      <g transform="translate(20, 50)">
        <rect width="410" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="25" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Super Admin Oversight Module</text>
        <text x="16" y="45" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Create City Managers, audit revenue, configure tiers</text>
      </g>

      <g transform="translate(20, 125)">
        <rect width="410" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="25" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Vendor Subscription &amp; Booking Engine</text>
        <text x="16" y="45" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Direct booking inquiry, quote generation &amp; calendars</text>
      </g>

      <g transform="translate(20, 200)">
        <rect width="410" height="135" rx="8" fill="#05070c" stroke="#1e293b"/>
        <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">MongoDB Schema &amp; Roles</text>
        <text x="16" y="52" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">roles: ['USER', 'VENDOR', 'CITY_MANAGER', 'ADMIN']</text>
        <text x="16" y="74" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">workflow: { status: 'PENDING_APPROVAL', reviewerId }</text>
        <text x="16" y="96" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">stack: [React.js, Node.js, Express.js, MongoDB]</text>
        <text x="16" y="118" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">✓ Schema validation &amp; JWT auth operational</text>
      </g>
    </g>
  </g>
</svg>

<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_shop" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="60%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="glow_cyan2" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_pattern5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06b6d4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg_shop)"/>
  <rect width="1200" height="800" fill="url(#grid_pattern5)"/>
  <rect width="1200" height="800" fill="url(#glow_cyan2)"/>

  <!-- Top badge -->
  <g transform="translate(100, 70)">
    <rect width="250" height="34" rx="17" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.4"/>
    <circle cx="20" cy="17" r="4" fill="#22d3ee"/>
    <text x="34" y="22" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1">FULL-STACK E-COMMERCE</text>
  </g>

  <!-- Mockup Window Shell -->
  <g transform="translate(100, 130)">
    <rect width="1000" height="580" rx="16" fill="#09101a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Title Bar -->
    <rect width="1000" height="48" rx="16" fill="#060a12"/>
    <rect y="47" width="1000" height="1" fill="#1e293b"/>
    <circle cx="28" cy="24" r="5.5" fill="#f87171" fill-opacity="0.8"/>
    <circle cx="48" cy="24" r="5.5" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="68" cy="24" r="5.5" fill="#34d399" fill-opacity="0.8"/>
    <text x="500" y="29" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">shoppers.store/shop/checkout</text>

    <!-- Content: Storefront layout -->
    <!-- Navbar simulation inside store -->
    <g transform="translate(40, 65)">
      <rect width="920" height="50" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="32" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">SHOPPERS</text>
      <text x="140" y="31" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Categories</text>
      <text x="230" y="31" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">New Arrivals</text>
      <text x="335" y="31" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Special Deals</text>

      <rect x="760" y="10" width="135" height="30" rx="6" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="827" y="30" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cart (3 items) 🛒</text>
    </g>

    <!-- Product Cards Grid -->
    <g transform="translate(40, 135)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="285" height="230" rx="10" fill="#0b1320" stroke="#1e293b"/>
        <rect x="15" y="15" width="255" height="110" rx="6" fill="#131c2e"/>
        <circle cx="142" cy="70" r="30" fill="#38bdf8" fill-opacity="0.2"/>
        <text x="142" y="76" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" text-anchor="middle">TECH</text>
        <text x="15" y="155" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Wireless Noise-Canceling ANC</text>
        <text x="15" y="178" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">Bluetooth 5.3 · 40h Battery</text>
        <text x="15" y="208" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">$189.99</text>
        <rect x="185" y="188" width="85" height="28" rx="6" fill="#3b82f6"/>
        <text x="227" y="206" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(315, 0)">
        <rect width="285" height="230" rx="10" fill="#0b1320" stroke="#1e293b"/>
        <rect x="15" y="15" width="255" height="110" rx="6" fill="#131c2e"/>
        <circle cx="142" cy="70" r="30" fill="#06b6d4" fill-opacity="0.2"/>
        <text x="142" y="76" fill="#06b6d4" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" text-anchor="middle">FIT</text>
        <text x="15" y="155" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Smart Fitness Tracker Pro</text>
        <text x="15" y="178" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">AMOLED · SpO2 · GPS</text>
        <text x="15" y="208" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">$129.50</text>
        <rect x="185" y="188" width="85" height="28" rx="6" fill="#3b82f6"/>
        <text x="227" y="206" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>
      </g>

      <!-- Item 3 / Order Summary -->
      <g transform="translate(630, 0)">
        <rect width="290" height="390" rx="10" fill="#080e16" stroke="#1e293b"/>
        <text x="20" y="32" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600">Checkout &amp; Tracking</text>
        
        <g transform="translate(20, 55)">
          <text x="0" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Subtotal</text>
          <text x="250" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" text-anchor="end">$319.49</text>

          <text x="0" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Express Shipping</text>
          <text x="250" y="44" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" text-anchor="end">Free</text>

          <line x1="0" y1="62" x2="250" y2="62" stroke="#1e293b"/>

          <text x="0" y="86" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Total</text>
          <text x="250" y="86" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" text-anchor="end">$319.49</text>

          <!-- Order tracking step -->
          <rect y="110" width="250" height="190" rx="8" fill="#0d1522" stroke="#1e293b"/>
          <text x="14" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">● ORDER #TRK-88219</text>
          <text x="14" y="52" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Out for Delivery</text>
          <text x="14" y="74" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Estimated: Today by 4:00 PM</text>

          <text x="14" y="110" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">API: Express.js REST</text>
          <text x="14" y="130" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">DB: MongoDB Orders Collection</text>
          <text x="14" y="150" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Auth: JWT Token / Cookie</text>
          <text x="14" y="170" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">Payment: Stripe Checkout</text>
        </g>
      </g>
    </g>

    <!-- Bottom Feature Tags -->
    <g transform="translate(40, 395)">
      <rect width="600" height="130" rx="10" fill="#080e16" stroke="#1e293b"/>
      <text x="20" y="30" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Core Full-Stack Capabilities</text>
      
      <g transform="translate(20, 50)">
        <rect width="170" height="55" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Cart &amp; Checkout</text>
        <text x="12" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Dynamic persistent cart</text>

        <g transform="translate(185, 0)">
          <rect width="170" height="55" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="12" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Live Order Tracking</text>
          <text x="12" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Real-time order statuses</text>
        </g>

        <g transform="translate(370, 0)">
          <rect width="170" height="55" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="12" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">User Account &amp; Profiles</text>
          <text x="12" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Address &amp; order history</text>
        </g>
      </g>
    </g>
  </g>
</svg>

<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_trade" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="60%" stop-color="#09141c"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="glow_emerald" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_pattern4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg_trade)"/>
  <rect width="1200" height="800" fill="url(#grid_pattern4)"/>
  <rect width="1200" height="800" fill="url(#glow_emerald)"/>

  <!-- Top badge -->
  <g transform="translate(100, 70)">
    <rect width="270" height="34" rx="17" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="20" cy="17" r="4" fill="#34d399"/>
    <text x="34" y="22" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1">MT4/MT5 TRADING ANALYTICS</text>
  </g>

  <!-- Mockup Window Shell -->
  <g transform="translate(100, 130)">
    <rect width="1000" height="580" rx="16" fill="#0b1219" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Title Bar -->
    <rect width="1000" height="48" rx="16" fill="#070c12"/>
    <rect y="47" width="1000" height="1" fill="#1e293b"/>
    <circle cx="28" cy="24" r="5.5" fill="#f87171" fill-opacity="0.8"/>
    <circle cx="48" cy="24" r="5.5" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="68" cy="24" r="5.5" fill="#34d399" fill-opacity="0.8"/>
    <text x="500" y="29" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">app.tradedge.io/analytics/playbook</text>

    <!-- Top KPI row -->
    <g transform="translate(40, 70)">
      <rect width="215" height="80" rx="10" fill="#0e1722" stroke="#1e293b"/>
      <text x="18" y="28" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Total P&amp;L (MT4/MT5)</text>
      <text x="18" y="58" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">+$24,850.40</text>

      <g transform="translate(235, 0)">
        <rect width="215" height="80" rx="10" fill="#0e1722" stroke="#1e293b"/>
        <text x="18" y="28" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Win Rate</text>
        <text x="18" y="58" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">68.4%</text>
      </g>

      <g transform="translate(470, 0)">
        <rect width="215" height="80" rx="10" fill="#0e1722" stroke="#1e293b"/>
        <text x="18" y="28" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Playbook Rules Adherence</text>
        <text x="18" y="58" fill="#a78bfa" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">92.0%</text>
      </g>

      <g transform="translate(705, 0)">
        <rect width="215" height="80" rx="10" fill="#0e1722" stroke="#1e293b"/>
        <text x="18" y="28" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Privacy / Visibility</text>
        <rect x="18" y="42" width="105" height="26" rx="13" fill="#10b981" fill-opacity="0.2"/>
        <circle cx="32" cy="55" r="4" fill="#34d399"/>
        <text x="44" y="60" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Public Live</text>
      </g>
    </g>

    <!-- Candlestick / Analytics Chart Graphic -->
    <g transform="translate(40, 170)">
      <rect width="580" height="350" rx="12" fill="#080e16" stroke="#1e293b"/>
      <text x="24" y="36" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600">Real-Time Performance Dashboard</text>
      
      <!-- Simulated Candlestick / Equity curve -->
      <g transform="translate(24, 70)">
        <!-- Grid lines -->
        <line x1="0" y1="40" x2="530" y2="40" stroke="#1e293b" stroke-dasharray="3 3"/>
        <line x1="0" y1="100" x2="530" y2="100" stroke="#1e293b" stroke-dasharray="3 3"/>
        <line x1="0" y1="160" x2="530" y2="160" stroke="#1e293b" stroke-dasharray="3 3"/>
        <line x1="0" y1="220" x2="530" y2="220" stroke="#1e293b" stroke-dasharray="3 3"/>

        <!-- Candles -->
        <line x1="40" y1="120" x2="40" y2="180" stroke="#34d399" stroke-width="2"/>
        <rect x="34" y="135" width="12" height="30" fill="#10b981"/>

        <line x1="90" y1="110" x2="90" y2="170" stroke="#f87171" stroke-width="2"/>
        <rect x="84" y="125" width="12" height="25" fill="#ef4444"/>

        <line x1="140" y1="90" x2="140" y2="160" stroke="#34d399" stroke-width="2"/>
        <rect x="134" y="105" width="12" height="40" fill="#10b981"/>

        <line x1="190" y1="80" x2="190" y2="140" stroke="#34d399" stroke-width="2"/>
        <rect x="184" y="90" width="12" height="35" fill="#10b981"/>

        <line x1="240" y1="95" x2="240" y2="150" stroke="#f87171" stroke-width="2"/>
        <rect x="234" y="105" width="12" height="20" fill="#ef4444"/>

        <line x1="290" y1="60" x2="290" y2="130" stroke="#34d399" stroke-width="2"/>
        <rect x="284" y="70" width="12" height="50" fill="#10b981"/>

        <line x1="340" y1="50" x2="340" y2="110" stroke="#34d399" stroke-width="2"/>
        <rect x="334" y="60" width="12" height="35" fill="#10b981"/>

        <!-- Smooth Equity Polyline -->
        <polyline points="20,190 80,160 140,140 200,110 260,120 320,80 380,60 450,45 520,30" 
                  fill="none" stroke="#38bdf8" stroke-width="3"/>
        <circle cx="520" cy="30" r="5" fill="#38bdf8"/>
        <text x="440" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">ATH High</text>
      </g>
    </g>

    <!-- Right Side: Playbook & Automation Specs -->
    <g transform="translate(645, 170)">
      <rect width="315" height="350" rx="12" fill="#080e16" stroke="#1e293b"/>
      <text x="20" y="32" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600">Trading Playbook &amp; Automation</text>

      <g transform="translate(20, 50)">
        <rect width="275" height="70" rx="8" fill="#0f1722" stroke="#1e293b"/>
        <text x="14" y="24" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Playbook Strategy Engine</text>
        <text x="14" y="46" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Risk-to-reward calculator &amp; entry setups</text>
      </g>

      <g transform="translate(20, 135)">
        <rect width="275" height="70" rx="8" fill="#0f1722" stroke="#1e293b"/>
        <text x="14" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Stripe Billing &amp; Subscriptions</text>
        <text x="14" y="46" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Automated recurring trader plans</text>
      </g>

      <g transform="translate(20, 220)">
        <rect width="275" height="95" rx="8" fill="#04070a" stroke="#1e293b"/>
        <text x="14" y="25" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">Cron &amp; NodeMailer Services</text>
        <text x="14" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">cron: '0 20 * * 1-5' (EOD reports)</text>
        <text x="14" y="72" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">dispatch: NodeMailer SMTP queue</text>
      </g>
    </g>
  </g>
</svg>
